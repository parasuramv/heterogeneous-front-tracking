[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "heterogeneous-front-tracking"
version = "0.1.0"
description = "Front tracking for u_t + (g(x) |u|^p)_x = 0, p > 1 with piecewise-affine heterogeneity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
notebook = ["ipywidgets>=8,<9", "jupyterlab>=4,<5", "nbclient>=0.10", "nbformat>=5"]

# src layout: an editable install exposes only the import package `hetfront`.
[tool.setuptools.packages.find]
where = ["src"]
